apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: api
  namespace: dev
spec:
  interval: 5m
  releaseName: api
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./charts/api
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    dbSecret: db
    image:
      repository: ghcr.io/gabrielegallenti/lab01-app
      tag: "709e912149e090a045f81b94cdf4f16504f74e8a"